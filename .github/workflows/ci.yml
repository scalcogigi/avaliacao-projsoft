name: CI, publicação e deploy

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/avaliacao-projsoft

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e verificar cobertura
        run: ./mvnw --batch-mode clean verify

      - name: Salvar relatório do JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar aplicação na VM
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ${{ secrets.USER_TEST }}
          key: ${{ secrets.KEY_TEST }}
          envs: IMAGE_NAME,DB_PASSWORD
          script: |
            set -e

            sudo docker network inspect app-network >/dev/null 2>&1 ||
              sudo docker network create app-network

            sudo docker pull "$IMAGE_NAME:latest"

            sudo docker rm -f curso-api 2>/dev/null || true

            sudo docker run -d \
              --name curso-api \
              --network app-network \
              --restart unless-stopped \
              -p 8081:8080 \
              -e DB_HOST=curso-db \
              -e DB_PORT=5432 \
              -e DB_NAME=auladb \
              -e DB_USER=usuario \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$IMAGE_NAME:latest"

            sleep 15
            curl --fail http://localhost:8081/cursos